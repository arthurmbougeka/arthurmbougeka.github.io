<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur Mbougeka — Computer Science Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <ul id="navlinks">
      <li><a href="#about" data-nav="about"></a></li>
      <li><a href="#projects" data-nav="projects"></a></li>
      <li><a href="#skills" data-nav="skills"></a></li>
      <li><a href="#education" data-nav="education"></a></li>
      <li><a href="#contact" data-nav="contact"></a></li>
    </ul>
    <div class="nav-controls">
      <button class="icon-btn" id="lang-toggle" aria-label="Switch language"></button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"></button>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-lead"></p>
      <div class="btn-row">
        <a href="#projects" class="btn btn-primary" id="btn-projects"></a>
        <a href="#contact" class="btn btn-outline" id="btn-contact"></a>
      </div>
    </div>
    <div class="motif">
      <div class="circle"></div>
      <div class="triangle"></div>
      <div class="square"></div>
    </div>
  </div>
</header>

<section id="about">
  <div class="wrap about-grid">
    <div>
      <div class="section-head"><span class="index mono">01</span><h2 id="about-heading"></h2></div>
      <div id="about-text"></div>
    </div>
    <ul class="facts" id="about-facts"></ul>
  </div>
</section>

<section class="alt" id="projects">
  <div class="wrap">
    <div class="section-head"><span class="index mono">02</span><h2 id="projects-heading"></h2></div>
    <div class="project-grid" id="project-grid"></div>
  </div>
</section>

<section id="skills">
  <div class="wrap">
    <div class="section-head"><span class="index mono">03</span><h2 id="skills-heading"></h2></div>
    <div class="skills-cols" id="skills-cols"></div>
  </div>
</section>

<section class="alt" id="education">
  <div class="wrap">
    <div class="section-head"><span class="index mono">04</span><h2 id="education-heading"></h2></div>
    <p class="lead" id="education-note" style="font-size:0.95rem; margin-bottom:32px;"></p>
    <div class="edu-timeline" id="edu-timeline"></div>
  </div>
</section>

<footer id="contact">
  <div class="wrap">
    <div class="section-head"><span class="index mono">05</span><h2 id="contact-heading-small"></h2></div>
    <h2 id="contact-heading"></h2>
    <div class="contact-links" id="contact-links"></div>
    <div class="foot-note" id="foot-note"></div>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
